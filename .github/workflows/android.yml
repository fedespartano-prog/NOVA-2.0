name: Build NOVA 2.0 APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download sherpa-onnx Android arm64 runtime
        run: |
          mkdir -p /tmp/sherpa-android app/src/main/jniLibs/arm64-v8a
          curl -L --fail --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-v2.0.3-android.tar.bz2 -o /tmp/sherpa-android.tar.bz2
          tar -xjf /tmp/sherpa-android.tar.bz2 -C /tmp/sherpa-android
          find /tmp/sherpa-android -type f -path '*/arm64-v8a/*.so' -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          test -n "$(find app/src/main/jniLibs/arm64-v8a -name '*.so' -print -quit)"
          ls -lh app/src/main/jniLibs/arm64-v8a
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-2.0-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
